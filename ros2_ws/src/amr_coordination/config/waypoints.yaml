# Waypoints for the demo scenario
# Each robot has a spawn position and a sequence of navigation goals
# Format: [x, y, yaw_radians]

robot1:
  spawn: [3.0, 2.0, 0.0]
  goals:
    - [17.0, 12.0, 0.0]    # top-right — crosses through chokepoint
    - [3.0, 2.0, 0.0]      # return home

robot2:
  spawn: [10.0, 1.5, 0.0]
  goals:
    - [10.0, 13.0, 0.0]    # straight north through chokepoint
    - [10.0, 1.5, 0.0]     # return home

robot3:
  spawn: [17.0, 2.0, 0.0]
  goals:
    - [3.0, 12.0, 0.0]     # top-left — crosses through chokepoint
    - [17.0, 2.0, 0.0]     # return home
